name: Welcome New Contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome Issue Commits
        if: github.event.issues.opened == true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "👋 Welcome to our GitHub Organization! Thank you for opening this issue. One of our maintainers will review it shortly. In the meantime, please make sure you've read our [CONTRIBUTING.md](https://github.com/yuvasamrajyaofficial-prog/zekkers-app2/blob/main/CONTRIBUTING.md) guide!"
            })

      - name: Welcome Pull Requests
        if: github.event.pull_request_target.opened == true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "🚀 Thank you for submitting this Pull Request! We appreciate your support in improving Zekkers & Malola. A maintainer will look at your changes soon. Please verify you run `npm run typecheck` before requesting reviews."
            })
